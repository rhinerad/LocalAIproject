services:
  redis:
    image: redis:7-alpine
    container_name: local-agent-phase1-redis
    restart: unless-stopped
    # Wrapper reapplies secondary ACL users on every container start, including
    # `docker restart`. It also injects `requirepass` from REDIS_PASSWORD via a
    # private 0600 config file, so the password is NOT on this command line
    # (it used to be `--requirepass ${REDIS_PASSWORD}`, visible in `ps`,
    # `docker inspect` and compose logs). Do not add --requirepass back here.
    entrypoint: ["sh", "/usr/local/bin/redis-with-acl-restore.sh"]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    environment:
      # Read by the wrapper (requirepass file + REDISCLI_AUTH) and the
      # healthcheck, only inside the container. It is not exposed in a port
      # mapping, application log, or checked-in environment file.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      # Intentionally local-only. Do not change to 0.0.0.0.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis-with-acl-restore.sh:/usr/local/bin/redis-with-acl-restore.sh:ro
      - ./runtime/redis-acl:/acl-restore:ro
    healthcheck:
      # REDISCLI_AUTH instead of `-a` keeps the password off the process list.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
