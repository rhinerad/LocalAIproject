name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (correctness rules only)
        run: ruff check .
      - name: Unit tests
        # conftest.py skips modules that need Windows, the operator's work/
        # folder, or optional heavy dependencies, and lists them in the summary.
        run: python -m pytest
